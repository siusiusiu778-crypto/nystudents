<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NY Students 夜景动画</title>
<style>
  html,body{margin:0;height:100%;background:#0b1026;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif}
  canvas{display:block;width:100%;height:100%}
  .title{position:fixed;left:0;right:0;top:14%;text-align:center;color:#fff;pointer-events:none;
    opacity:0;animation:fade 2.5s .5s forwards}
  .title h1{margin:0;font-size:clamp(28px,6vw,64px);letter-spacing:.08em;font-weight:700}
  .title p{margin:.6em 0 0;font-size:clamp(14px,2vw,20px);opacity:.8;letter-spacing:.2em}
  @keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>纽约留学生网</h1><p>NY STUDENTS NETWORK</p></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, stars = [], buildings = [], t = 0;

function rand(a, b){ return a + Math.random() * (b - a); }

function init(){
  W = cv.width = innerWidth * devicePixelRatio;
  H = cv.height = innerHeight * devicePixelRatio;
  const u = H / 800; // 缩放单位
  stars = Array.from({length: 140}, () => ({
    x: rand(0, W), y: rand(0, H * .6), r: rand(.5, 1.8) * u, p: rand(0, 6.28), s: rand(1, 3)
  }));
  buildings = [];
  let x = 0;
  while (x < W){
    const w = rand(50, 110) * u, h = rand(120, 380) * u;
    const cols = Math.floor(w / (16 * u)), rows = Math.floor(h / (22 * u));
    const wins = [];
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++)
      wins.push({i, j, on: Math.random() < .4, next: rand(0, 400)});
    buildings.push({x, w, h, cols, rows, wins, shade: rand(.8, 1.2), spire: Math.random() < .25});
    x += w + rand(0, 8) * u;
  }
}

function sky(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#060818'); g.addColorStop(.6, '#1a2456'); g.addColorStop(1, '#3b3270');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars){
    ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(t / 30 * s.s * .3 + s.p));
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 月亮
  const mx = W * .8, my = H * .18, mr = H * .05;
  const mg = ctx.createRadialGradient(mx, my, mr * .5, mx, my, mr * 3);
  mg.addColorStop(0, 'rgba(255,245,200,.35)'); mg.addColorStop(1, 'rgba(255,245,200,0)');
  ctx.fillStyle = mg; ctx.fillRect(mx - mr * 3, my - mr * 3, mr * 6, mr * 6);
  ctx.fillStyle = '#fff6d6'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.28); ctx.fill();
}

function city(){
  const u = H / 800, base = H;
  for (const b of buildings){
    const top = base - b.h;
    // 楼体生长动画：前 90 帧从下往上升起
    const grow = Math.min(1, t / 90);
    const hh = b.h * (1 - Math.pow(1 - grow, 3));
    ctx.fillStyle = `rgb(${14*b.shade},${18*b.shade},${40*b.shade})`;
    ctx.fillRect(b.x, base - hh, b.w, hh);
    if (b.spire){
      ctx.fillRect(b.x + b.w / 2 - 2 * u, base - hh - 40 * u * grow, 4 * u, 40 * u * grow);
      ctx.fillStyle = Math.sin(t / 15) > 0 ? '#ff4d4d' : '#661a1a';
      ctx.beginPath(); ctx.arc(b.x + b.w / 2, base - hh - 40 * u * grow, 3 * u, 0, 6.28); ctx.fill();
    }
    if (grow < 1) continue;
    for (const w of b.wins){
      if (--w.next < 0){ if (Math.random() < .5) w.on = !w.on; w.next = rand(120, 600); }
      if (!w.on) continue;
      ctx.fillStyle = '#ffd87a';
      ctx.fillRect(b.x + 8 * u + w.i * 16 * u, top + 12 * u + w.j * 22 * u, 8 * u, 12 * u);
    }
  }
}

const plane = {x: -200, trail: []};
function flyPlane(){
  const u = H / 800;
  plane.x += 3 * u;
  if (plane.x > W + 200){ plane.x = -200; plane.trail = []; }
  const y = H * .32 + Math.sin(plane.x / (120 * u)) * 14 * u - plane.x * .03;
  plane.trail.push({x: plane.x, y});
  if (plane.trail.length > 70) plane.trail.shift();
  plane.trail.forEach((p, i) => {
    ctx.globalAlpha = i / plane.trail.length * .5;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.2 * u, 0, 6.28); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#e8eefc';
  ctx.beginPath();
  ctx.ellipse(plane.x, y, 14 * u, 4 * u, -.1, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.moveTo(plane.x - 2 * u, y); ctx.lineTo(plane.x - 10 * u, y + 12 * u);
  ctx.lineTo(plane.x + 2 * u, y + 2 * u); ctx.fill();
  // 闪烁灯
  ctx.fillStyle = Math.sin(t / 8) > 0 ? '#ff5252' : '#3a1010';
  ctx.beginPath(); ctx.arc(plane.x - 12 * u, y, 2 * u, 0, 6.28); ctx.fill();
}

function loop(){
  t++;
  sky(); flyPlane(); city();
  requestAnimationFrame(loop);
}
addEventListener('resize', init);
init(); loop();
</script>
</body>
</html>
